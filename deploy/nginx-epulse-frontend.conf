# Use inside the existing server block for epulse.excelligent.co.in.
# Keep the existing listen/SSL directives and the current root path.
root /home/hisol/e-pulse/frontend/dist;
index index.html;

# Public routes are prerendered as real HTML files.
location / {
    try_files $uri $uri/ =404;
}

# Private application URLs must receive the empty, noindex app shell,
# never the prerendered marketing homepage.
location ~ ^/(login|signup|forgot-password|reset-password|admin|dashboard)(/|$) {
    try_files $uri /app-shell.html;
}

# Serve a branded 404 document with an actual HTTP 404 response.
error_page 404 /404.html;
location = /404.html {
    internal;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
